version: "2"
run:
  build-tags:
    - release
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
        - (*os.File).Close
        - (*os.Root).Close
        - (*os.Root).Remove
        - (io.WriteCloser).Close
        - (io.ReadCloser).Close
        - (*github.com/davidklassen/winch/internal/session.Session).Close
        - (*io.PipeWriter).Close
        - os.Remove
        - os.RemoveAll
        - (net.Listener).Close
        - (*net/http.Server).Close
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/davidklassen/winch
