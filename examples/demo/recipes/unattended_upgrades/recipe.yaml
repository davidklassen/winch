steps:
  - debconf:
      package: unattended-upgrades
      question: unattended-upgrades/enable_auto_updates
      type: boolean
      value: "true"
  - pkg:
      name: unattended-upgrades
      recommends: false
  - file:
      path: /etc/apt/apt.conf.d/51unattended-upgrades-local
      content: |
        Unattended-Upgrade::Mail "root";
