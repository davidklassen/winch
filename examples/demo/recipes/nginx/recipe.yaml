# nginx serves only the sites of the project. The web stage reloads nginx
# after the sites, which change its config too.
steps:
  - pkg:
      name: nginx
  - name: Debian's stock nginx.conf
    file:
      path: /etc/nginx/nginx.conf
      stock: true
      validate: nginx -t
  - file:
      path: /etc/nginx/snippets/tls.conf
      source: tls.conf
  - name: Only our sites (removes Debian's default)
    dir:
      path: /etc/nginx/sites-enabled
      purge: true
  - service:
      name: nginx
      enabled: true
      running: true
