# nginx serves only the sites of the project.
steps:
  - pkg:
      name: nginx
  - name: Debian's stock nginx.conf
    file:
      path: /etc/nginx/nginx.conf
      stock: true
      validate: nginx -t
    notify: reload
  - file:
      path: /etc/nginx/snippets/tls.conf
      source: tls.conf
    notify: reload
  - name: Only our sites (removes Debian's default)
    dir:
      path: /etc/nginx/sites-enabled
      purge: true
    notify: reload
  - service:
      name: nginx
      enabled: true
      running: true

handlers:
  reload:
    - service:
        name: nginx
        reloaded: true
