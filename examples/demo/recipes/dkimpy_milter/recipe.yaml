steps:
  - pkg:
      name: dkimpy-milter
  - name: DKIM key, RSA 2048 from dknewkey, selector "dkim"
    file:
      path: /etc/dkimpy-milter/dkim.key
      content: !expr vars.dkimpy_milter_key
      mode: "0600"
  - file:
      path: /etc/dkimpy-milter/dkimpy-milter.conf
      template: dkimpy-milter.conf.tmpl
  - service:
      name: dkimpy-milter
      enabled: true
      running: true
  - service:
      name: dkimpy-milter
      restarted: true
    on_change: [/etc/dkimpy-milter]
