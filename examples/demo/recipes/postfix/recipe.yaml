# Postfix on loopback: it sends mail signed by dkimpy-milter and delivers
# the mail of the domain to Dovecot.
steps:
  - debconf:
      package: postfix
      question: postfix/main_mailer_type
      type: select
      value: Internet Site
  - pkg:
      name: postfix
      recommends: false
  - file:
      path: /etc/mailname
      content: !tpl "{{ host.name }}\n"
  - file:
      path: /etc/postfix/vmailbox
      template: vmailbox.tmpl
    then: postmap /etc/postfix/vmailbox
    notify: reload
  - file:
      path: /etc/postfix/main.cf
      template: main.cf.tmpl
      validate: postfix check
    # inet_interfaces takes effect only after a restart.
    notify: restart
  - name: Debian's stock master.cf
    file:
      path: /etc/postfix/master.cf
      copy_from: /usr/share/postfix/master.cf.dist
    notify: restart
  - file:
      path: /etc/aliases
      template: aliases.tmpl
    then: newaliases
  - service:
      name: postfix
      enabled: true
      running: true

handlers:
  reload:
    - service:
        name: postfix
        reloaded: true
  restart:
    - service:
        name: postfix
        restarted: true
