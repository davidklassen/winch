# Replaces Debian's 10-auth.conf: no system users, only /etc/dovecot/users
# (bcrypt, cost 12). All mail belongs to vmail.
auth_mechanisms = plain login

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /var/vmail/%{user | domain}/%{user | username}
  }
}
