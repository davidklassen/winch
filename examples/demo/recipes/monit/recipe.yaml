# Each node checks itself (inside) and every other node (outside).
# Alert only; restarts are systemd's job.
# outside.tmpl sees each peer from outside. A mail server gets the mail
# ports, the web sites, and DANE; any other node gets SSH. "protocol
# smtps" on port 25 means STARTTLS.
steps:
  - pkg:
      name: [monit, python3-dnspython]
  - file:
      path: /usr/local/bin/postfix-queue-age
      source: postfix-queue-age
      mode: "0755"
  - name: Debian's stock monitrc
    file:
      path: /etc/monit/monitrc
      stock: true
  - file:
      path: !tpl /etc/monit/conf.d/{{ item }}
      template: !tpl '{{ item }}.tmpl'
      mode: "0600"
      validate: monit -t
    loop: [settings, inside, outside]
  - dir:
      path: /etc/monit/conf.d
      purge: true
  - service:
      name: monit
      enabled: true
      running: true
  - service:
      name: monit
      reloaded: true
    on_change: [/etc/monit]
