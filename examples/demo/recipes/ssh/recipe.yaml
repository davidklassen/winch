steps:
  - name: Debian's stock sshd_config
    file:
      path: /etc/ssh/sshd_config
      copy_from: /usr/share/openssh/sshd_config
      validate: sshd -t
  - file:
      path: /etc/ssh/sshd_config.d/local.conf
      content: |
        PasswordAuthentication no
        ClientAliveInterval 120
      validate: sshd -t
  - name: Remove cloud-init's and other foreign drop-ins
    dir:
      path: /etc/ssh/sshd_config.d
      purge: true
  - service:
      name: ssh
      reloaded: true
    on_change: [/etc/ssh]
    confirm_access: true
