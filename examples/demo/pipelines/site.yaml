stages:
  - name: base
    hosts: all
    steps:
      - recipe: admin
      - recipe: leftovers
      - recipe: ssh
      - recipe: nftables
      - recipe: hostname
      - timezone:
          name: Etc/UTC
      - group:
          name: deploy
          gid: 2000
      - user:
          name: deploy
          uid: 2000
          group: deploy
          shell: /bin/bash
          authorized_keys: !expr vars.admin_authorized_keys
      - file:
          path: /etc/motd
          content: !tpl "{{ .host.name }} is managed by winch.\n"
      - pkg:
          name: curl
      - recipe: unbound
      - recipe: dkimpy_milter
      # monit's postinst adds "monit: root" to /etc/aliases; the postfix
      # recipe then writes the file as the project declares it.
      - recipe: monit
        vars:
          # The other nodes, checked from outside.
          monit_peers: !expr 'filter(match("all"), .name != host.name)'
      - recipe: postfix
      - recipe: unattended_upgrades
      - recipe: rspamd
      - recipe: heartbeat

  # One web host at a time; the next starts when the site answers.
  - name: web
    hosts: web
    parallelism: 1
    health:
      command: curl -sf -o /dev/null http://localhost/
      stable: 2
      timeout: 30
    steps:
      - recipe: nginx
      - recipe: pebble
      # Before the site and Dovecot: their configs name these files.
      - recipe: certbot
      - recipe: website
        vars:
          website_peers: !expr 'filter(match("web"), .name != host.name)'
      - recipe: dovecot
      - recipe: fail2ban
