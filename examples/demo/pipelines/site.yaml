stages:
  - name: base
    hosts: all
    steps:
      - file:
          path: /etc/motd
          content: !tpl "{{ .host.name }} is managed by winch.\n"
      - pkg:
          name: curl
      - recipe: unbound
      - recipe: dkimpy_milter

  - name: web
    hosts: web
    steps:
      - recipe: nginx
      - recipe: website
