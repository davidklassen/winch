stages:
  - name: base
    hosts: all
    steps:
      - recipe: admin
      - group:
          name: deploy
          gid: 2000
      - user:
          name: deploy
          uid: 2000
          group: deploy
          shell: /bin/bash
          authorized_keys: !expr vars.admin_authorized_keys
      - file:
          path: /etc/motd
          content: !tpl "{{ .host.name }} is managed by winch.\n"
      - pkg:
          name: curl
      - recipe: unbound
      - recipe: dkimpy_milter
      - recipe: postfix
      - recipe: unattended_upgrades
      - recipe: rspamd
      - recipe: heartbeat

  # One web host at a time; the next starts when the site answers.
  - name: web
    hosts: web
    parallelism: 1
    health:
      command: curl -sf -o /dev/null http://localhost/
      stable: 2
      timeout: 30
    steps:
      - recipe: nginx
      - recipe: website
        vars:
          website_peers: !expr 'filter(match("web"), .name != host.name)'
