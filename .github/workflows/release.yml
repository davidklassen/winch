name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sh release/notes.sh "$GITHUB_REF_NAME" CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean --skip=publish
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      - run: go test -tags release ./release/
      - name: Check that winch prints the version of the tag
        run: |
          tar -xzf dist/winch-darwin-arm64.tar.gz -C "$RUNNER_TEMP" winch
          "$RUNNER_TEMP/winch" version | tee /dev/stderr | grep -qx "winch $GITHUB_REF_NAME darwin/arm64"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      # Apple can hold a submission for days. The tap workflow waits for
      # Apple's verdict and finds each submission by its name.
      - name: Submit the macOS binaries to Apple's notary service
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          printf '%s' "$MACOS_NOTARY_KEY" | base64 -d > "$RUNNER_TEMP/notary.p8"
          for arch in arm64 amd64; do
            sha=$(awk -v name="winch-darwin-$arch.tar.gz" '$2 == name { print $1 }' dist/checksums.txt)
            mkdir "$RUNNER_TEMP/$arch"
            tar -xzf "dist/winch-darwin-$arch.tar.gz" -C "$RUNNER_TEMP/$arch" winch
            ditto -c -k "$RUNNER_TEMP/$arch/winch" "$RUNNER_TEMP/winch-darwin-$arch-$sha.zip"
            xcrun notarytool submit "$RUNNER_TEMP/winch-darwin-$arch-$sha.zip" --no-wait \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID"
          done
      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case $GITHUB_REF_NAME in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag $pre \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*.tar.gz dist/checksums.txt release/install.sh
