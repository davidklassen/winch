name: tap

on:
  release:
    types: [published]
  # Writes the cask of an earlier release again, after a bad release.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, such as v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: tap
  cancel-in-progress: false

jobs:
  cask:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: davidklassen/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Write the cask from the checksums of the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern checksums.txt --dir "$RUNNER_TEMP"
          mkdir -p tap/Casks
          sh release/cask.sh "$TAG" "$RUNNER_TEMP/checksums.txt" > tap/Casks/winch.rb
      - name: Push the cask
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/winch.rb
          if git diff --cached --quiet; then
            echo "the cask of $TAG is already in the tap"
            exit 0
          fi
          git commit -m "winch $TAG"
          git push
